<!doctype html>
<!-- 소셜 공유 이미지(images/brand/og-image-v3.png, 1200×630) 원본.
     재생성: 이 파일을 헤드리스 브라우저로 1200×630 뷰포트에서 열어 스크린샷한다.
     로고 경로는 app.js ARCH_MARK_PATH와 동일하게 유지할 것. -->
<html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:OgSerif;src:url(og-serif.woff2) format("woff2")}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#f0ece4;font-family:OgSerif,serif;display:flex;flex-direction:column;overflow:hidden}
.top{flex:1;display:flex;align-items:center;justify-content:center;gap:56px;padding:0 80px}
.mark{width:150px;height:203px;color:#1c4336}
.name{font-size:76px;color:#1c4336;letter-spacing:.01em;line-height:1.1}
.tag{margin-top:18px;font-size:30px;color:#7f8650;letter-spacing:.42em}
.band{height:150px;background:#1c4336;display:flex;align-items:center;justify-content:space-between;padding:0 80px}
.slogan{font-size:38px;color:#f0ece4;letter-spacing:.02em}
.chips{display:flex;gap:14px}.chips i{display:block;width:46px;height:46px;border-radius:6px}
</style></head><body>
<div class="top">
  <svg class="mark" viewBox="0 0 40 54"><path fill="currentColor" d="M2 54V18.5C2 9.6 9.2 2.8 18.75 1.6L18.37 18.8H12.4v2.8h5.9L17.6 54ZM38 54V18.5C38 9.6 30.8 2.8 21.25 1.6L21.63 18.8H27.6v2.8h-5.9L22.4 54Z"/></svg>
  <div><div class="name">대한성공회 광명교회</div><div class="tag">녹색교회</div></div>
</div>
<div class="band"><div class="slogan">모든 생명을 환대하는 교회</div>
  <div class="chips"><i style="background:#2f6a52"></i><i style="background:#b1b883"></i><i style="background:#f0ece4"></i></div></div>
</body></html>
