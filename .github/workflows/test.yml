name: Test

# PR과 main 푸시마다 테스트를 돌린다. 사이트 문구 문장 기준(tests/copyStyle.test.js)도 여기서 막는다(2026-11-22).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
