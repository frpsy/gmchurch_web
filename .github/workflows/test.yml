name: Test

# PR과 main 푸시마다 테스트를 돌린다. 사이트 문구 문장 기준(tests/copyStyle.test.js)도 여기서 막는다(2026-11-22).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      # 모든 페이지를 브라우저로 열어 콘솔 오류·404·가로 넘침·페이지 전환 리스너 누적을 막는다
      # (scripts/site-check.mjs, docs/perf-refactor-plan.md 0단계). Playwright는 package.json에 넣지 않는다.
      - name: Browser smoke
        run: |
          npm i --no-save playwright@1.65.1
          npx playwright install --with-deps chromium
          node scripts/site-check.mjs smoke
