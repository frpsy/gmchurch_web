name: Sync Sunday Bulletins

# 주보 목록(data.js)과 교회소식·핵심구절을 보관 규칙에 맞춰 갱신합니다.
# 실행 시점
# - bulletins/ 에 이미지가 push될 때: 새 주보 등록(PDF 생성, 절기명·전례독서 자동 계산)
# - 매일 03:00(한국시간): 새 주보가 없어도 8주 넘게 지난 주보·교회소식을 자동 삭제
# 보관 규칙: 최근 8개 주보 이내, 8주(56일) 이내. 가장 최근 1건은 기간이 지나도 남김 (scripts/sync-bulletins.js)
# 파일명 형식: YYYYMMDD_1.jpg, YYYYMMDD_2.jpg ... (주보 페이지 순서대로)

on:
  push:
    branches: [main]
    paths:
      - 'bulletins/*.jpg'
      - 'bulletins/*.jpeg'
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Sync bulletin entries
        run: node scripts/sync-bulletins.js

      # 자동으로 지운 결과가 사이트를 깨뜨리지 않는지 확인한 뒤에만 커밋한다
      - name: Test
        run: npm test

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bulletins/ data.js data/bulletin-news.json data/bulletin-verses.json
          git diff --cached --quiet && echo "변경 없음" || (
            TODAY=$(date +%Y%m%d)
            sed -i "s/data\.js?v=[A-Za-z0-9_-]*/data.js?v=${TODAY}/g" *.html
            git add *.html
            git commit -m "chore: 주보 자동 갱신 ($(date +%Y-%m-%d))"
            git push
          )
