<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b1511">
  <title>예배 슬라이드 | 성공회 광명교회</title>
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA1NCIgYXJpYS1sYWJlbD0i6rSR66qF6rWQ7ZqMIOyXtOumsCDruZsiPjxwYXRoIGQ9Ik0yIDU0VjE4LjVDMiA5LjYgOS4yIDIuOCAxOC43NSAxLjZMMTguMzcgMTguOEgxMi40djIuOGg1LjlMMTcuNiA1NFpNMzggNTRWMTguNUMzOCA5LjYgMzAuOCAyLjggMjEuMjUgMS42TDIxLjYzIDE4LjhIMjcuNnYyLjhoLTUuOUwyMi40IDU0WiIgZmlsbD0iIzE3M2EyZSIvPjwvc3ZnPgo=" type="image/svg+xml">
  <style>
/* 예배 슬라이드 — 투사용 단색 배경·단색 글자, 움직임 없음. 데이터: data/worship/YYYYMMDD.json */
:root{
  --bg:#0b1511;--fg:#f4f1ea;--muted:color-mix(in srgb,var(--fg) 62%,var(--bg));
  --accent:#b9d8b4;--gold:#e6cf8f;--warn:#f0b35a;--line:color-mix(in srgb,var(--fg) 22%,var(--bg));
  --panel:#12221b;--ui-h:52px;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none}
body{font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

#stage{position:fixed;inset:0 0 var(--ui-h);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4vh 6vw;text-align:center}
#stage.is-blank{visibility:hidden}
.slide{width:100%;max-width:1500px;display:flex;flex-direction:column;align-items:center;gap:2.2vh}
.kicker{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:.4em 1em;color:var(--muted);font-size:clamp(15px,min(2.8vh,2vw),30px);letter-spacing:.02em}
.kicker .label{color:var(--gold);font-weight:650}
.kicker .stand{color:var(--accent);margin-right:.3em}
.by{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:.05em .8em;font-size:.92em}
.by[data-role=all]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,var(--bg))}
.by[data-role=celebrant]{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,var(--bg))}
.part{font-variant-numeric:tabular-nums}
.body{font-size:clamp(20px,min(5.4vh,3.7vw),64px);line-height:1.62;font-weight:500;letter-spacing:-.01em;text-wrap:balance;max-width:26em}
.body p{margin:0}
.body .gap{height:.9em}
.body .mark{color:var(--accent);margin-right:.5em;font-size:.82em}
.slide--reading .body{text-align:left}
.slide--reading .body,.slide--psalm .body{max-width:25em}
.slide--psalm .body{text-align:left}
.slide--psalm .body p.resp{padding-left:1.2em;color:var(--accent)}

.slide--title{gap:3vh}
.slide--title .head{font-size:clamp(34px,min(9vh,7vw),110px);font-weight:700;letter-spacing:-.03em;line-height:1.2}
.slide--title .head .stand{color:var(--accent);margin-right:.25em;font-weight:500}
.slide--title .sub{font-size:clamp(24px,min(6vh,4.6vw),70px);color:var(--gold);font-weight:600}
.slide--title .by{font-size:clamp(18px,min(3.6vh,2.8vw),40px)}

.slide--section .head{font-size:clamp(40px,min(11vh,8.5vw),130px);font-weight:700;letter-spacing:-.03em;color:var(--accent)}
.slide--cover .head{font-size:clamp(34px,min(9vh,6.8vw),104px);font-weight:700;letter-spacing:-.035em;line-height:1.25}
.slide--cover ul{list-style:none;margin:2vh 0 0;padding:0;color:var(--muted);font-size:clamp(20px,min(4vh,3vw),46px);line-height:1.7}
.slide--cover .date{margin-top:2vh;color:var(--gold);font-size:clamp(16px,min(3vh,2.2vw),32px);letter-spacing:.08em}

.ribbon{position:fixed;top:0;left:0;right:0;padding:.5em 1em;background:var(--warn);color:#1b1304;font-weight:700;font-size:clamp(13px,2vh,20px);text-align:center;z-index:5}

#ui{position:fixed;left:0;right:0;bottom:0;height:var(--ui-h);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 max(12px,2.5vw);background:var(--panel);border-top:1px solid var(--line);z-index:10;transition:opacity .3s}
body.idle #ui{opacity:0;pointer-events:none}
body.idle{cursor:none}
#ui .group{display:flex;align-items:center;gap:6px}
#ui button{min-width:40px;height:36px;padding:0 10px;white-space:nowrap;border:1px solid transparent;background:transparent;border-radius:6px;font-size:15px}
#ui button:hover{background:color-mix(in srgb,var(--fg) 12%,var(--panel));border-color:var(--line)}
#ui .arrow{font-size:22px}
#counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap}
#counter b{color:var(--fg)}
#progress{position:absolute;left:0;top:-1px;height:2px;background:var(--accent);width:0}

#outline{position:fixed;top:0;left:0;bottom:var(--ui-h);width:min(440px,92vw);background:var(--panel);border-right:1px solid var(--line);padding:18px 14px 12px;overflow-y:auto;transform:translateX(-102%);transition:transform .25s;z-index:20;text-align:left}
#outline.is-open{transform:none}
#outline h2{margin:0 0 6px;font-size:15px;color:var(--gold)}
#outline p.legend{margin:0 0 12px;color:var(--muted);font-size:13px}
#outline .sec{margin:14px 0 4px;font-size:13px;color:var(--accent);letter-spacing:.06em}
#outline ol{list-style:none;margin:0;padding:0}
#outline button{display:flex;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 4px;font-size:15px;color:color-mix(in srgb,var(--fg) 85%,var(--bg))}
#outline button:hover,#outline button[aria-current=true]{background:color-mix(in srgb,var(--fg) 12%,var(--panel));color:var(--fg)}
#outline .n{min-width:2em;color:var(--muted);font-variant-numeric:tabular-nums}
#outline .dummy{margin-left:auto;color:var(--warn);font-size:12px}

#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:18px;line-height:1.7;color:var(--muted)}
#msg.is-on{display:flex}
.skip{position:fixed;left:8px;top:-60px;background:var(--fg);color:var(--bg);padding:8px 12px;z-index:30}
.skip:focus{top:8px}
@media (max-width:520px){#ui{gap:4px;padding:0 6px}#ui button{padding:0 6px;font-size:13px}}
@media (prefers-reduced-motion:reduce){#outline,#ui{transition:none}}
  </style>
</head>
<body>
  <a class="skip" href="#stage">슬라이드로 바로가기</a>
  <div id="ribbon" class="ribbon" hidden>더미 — 성가집·기도서 파일 반영 전의 임시 문구입니다</div>
  <main id="stage" aria-live="polite" tabindex="-1"></main>
  <div id="msg" role="status"></div>
  <aside id="outline" aria-label="목차"></aside>
  <nav id="ui" aria-label="슬라이드 조작">
    <div id="progress"></div>
    <div class="group">
      <button id="btn-outline" type="button" aria-label="목차 열기 (O)" aria-expanded="false">목차</button>
    </div>
    <div class="group">
      <button id="btn-prev" class="arrow" type="button" aria-label="이전 (←)">‹</button>
      <span id="counter"></span>
      <button id="btn-next" class="arrow" type="button" aria-label="다음 (→)">›</button>
    </div>
    <div class="group">
      <button id="btn-blank" type="button" aria-pressed="false" aria-label="빈 화면 (B)">빈 화면</button>
      <button id="btn-full" type="button" aria-label="전체 화면 (F)">전체 화면</button>
    </div>
  </nav>
  <script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let data = null;
  let slides = [];
  let cur = 0;

  const roleOf = by => (by === '다 함께' ? 'all' : by === '집전자' ? 'celebrant' : 'person');
  const byHtml = by => (by ? `<span class="by" data-role="${roleOf(by)}">${esc(by)}</span>` : '');
  const standHtml = s => (s.stand ? '<span class="stand" aria-label="일어섭니다">†</span>' : '');

  function slideHtml(s) {
    switch (s.kind) {
    case 'cover':
      return `<section class="slide slide--cover"><h1 class="head">${esc(s.title)}</h1><ul>${s.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul><div class="date">${esc(data.date.replaceAll('-', '. '))}</div></section>`;
    case 'section':
      return `<section class="slide slide--section"><h2 class="head">${esc(s.title)}</h2></section>`;
    case 'title':
      return `<section class="slide slide--title"><div class="head">${standHtml(s)}${esc(s.label)}</div>${s.sub ? `<div class="sub">${esc(s.sub)}</div>` : ''}${byHtml(s.by)}</section>`;
    case 'text': {
      const kind = s.label === '성시' ? 'psalm' : /독서|복음/.test(s.label) ? 'reading' : 'lyrics';
      const body = s.lines.map(l => (l.gap ? '<div class="gap"></div>' : `<p${l.mark === '○' ? ' class="resp"' : ''}>${l.mark ? `<span class="mark">${esc(l.mark)}</span>` : ''}${esc(l.text)}</p>`)).join('');
      return `<section class="slide slide--${kind}"><div class="kicker"><span class="label">${standHtml(s)}${esc(s.label)}</span>${s.sub ? `<span>${esc(s.sub)}</span>` : ''}${byHtml(s.by)}${s.part ? `<span class="part">${esc(s.part)}</span>` : ''}</div><div class="body">${body}</div></section>`;
    }
    default:
      return '';
    }
  }

  let blank = false;
  function setBlank(on) {
    blank = on;
    stage.classList.toggle('is-blank', blank || slides[cur]?.kind === 'blank');
    $('btn-blank').setAttribute('aria-pressed', String(blank));
  }

  function show(i) {
    cur = Math.max(0, Math.min(slides.length - 1, i));
    const s = slides[cur];
    stage.innerHTML = slideHtml(s);
    setBlank(false);
    $('ribbon').hidden = !s.dummy;
    $('counter').innerHTML = `<b>${cur + 1}</b> / ${slides.length}`;
    $('progress').style.width = `${((cur + 1) / slides.length) * 100}%`;
    $('btn-prev').disabled = cur === 0;
    $('btn-next').disabled = cur === slides.length - 1;
    document.querySelectorAll('#outline button').forEach((b, k) => b.toggleAttribute('aria-current', k === cur));
    try { history.replaceState(null, '', `#${cur + 1}`); } catch (e) { /* 파일 열기 등에서는 주소를 바꾸지 않는다 */ }
  }
  const go = d => show(cur + d);

  function buildOutline() {
    let html = '<h2>목차</h2><p class="legend">† 일어섭니다</p>';
    let sec = null;
    let list = false;
    slides.forEach((s, i) => {
      if (s.kind === 'section' || s.kind === 'cover') {
        if (list) html += '</ol>';
        html += `<div class="sec">${esc(s.title)}</div><ol>`;
        list = true;
        sec = s.title;
        if (s.kind === 'section') return;
      }
      const name = s.kind === 'cover' ? '표지' : `${s.stand ? '† ' : ''}${s.label || ''}${s.sub ? ` ${s.sub}` : ''}${s.part ? ` (${s.part})` : ''}`;
      html += `<li><button type="button" data-i="${i}"><span class="n">${i + 1}</span><span>${esc(name)}</span>${s.dummy ? '<span class="dummy">더미</span>' : ''}</button></li>`;
    });
    $('outline').innerHTML = html + (list ? '</ol>' : '');
  }

  function toggleOutline(force) {
    const open = force ?? !$('outline').classList.contains('is-open');
    $('outline').classList.toggle('is-open', open);
    $('btn-outline').setAttribute('aria-expanded', String(open));
  }

  function toggleFull() {
    const el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
  }

  $('btn-prev').onclick = () => go(-1);
  $('btn-next').onclick = () => go(1);
  $('btn-blank').onclick = () => setBlank(!blank);
  $('btn-full').onclick = toggleFull;
  $('btn-outline').onclick = () => toggleOutline();
  $('outline').addEventListener('click', e => {
    const b = e.target.closest('button[data-i]');
    if (b) { show(Number(b.dataset.i)); toggleOutline(false); }
  });

  window.addEventListener('hashchange', () => { const n = Number(location.hash.slice(1)); if (slides.length && n >= 1 && n - 1 !== cur) show(n - 1); });

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(k)) { if (document.activeElement?.tagName === 'BUTTON' && (k === ' ' || k === 'Enter')) return; e.preventDefault(); go(1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); go(-1); }
    else if (k === 'Home') show(0);
    else if (k === 'End') show(slides.length - 1);
    else if (k === 'f' || k === 'F') toggleFull();
    else if (k === 'b' || k === 'B' || k === '.') setBlank(!blank);
    else if (k === 'o' || k === 'O') toggleOutline();
    else if (k === 'Escape') toggleOutline(false);
  });

  // 화면 가장자리 누름: 왼쪽 30%는 이전, 나머지는 다음. 좌우 쓸기도 지원
  stage.addEventListener('click', e => { toggleOutline(false); go(e.clientX < innerWidth * 0.3 ? -1 : 1); });
  let sx = null;
  document.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx;
    sx = null;
    if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
  }, { passive: true });

  // 조작 막대와 커서는 가만히 있으면 숨긴다
  let idleTimer;
  const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add('idle'), 3500); };
  ['mousemove', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, wake, { passive: true }));

  const msg = text => { $('msg').textContent = text; $('msg').classList.add('is-on'); $('ui').style.display = 'none'; };

  async function load() {
    const q = new URLSearchParams(location.search).get('date');
    let key = q && q.replaceAll('-', '');
    if (!key) {
      const index = await (await fetch('../../data/worship/index.json')).json();
      key = index.dates[0];
    }
    if (!/^\d{8}$/.test(key || '')) throw new Error('날짜 형식은 YYYYMMDD입니다.');
    const res = await fetch(`../../data/worship/${key}.json`);
    if (!res.ok) throw new Error(`${key} 주의 슬라이드가 없습니다.`);
    data = await res.json();
    slides = data.slides;
    document.title = `${data.title} | 예배 슬라이드`;
    buildOutline();
    const n = Number(location.hash.slice(1));
    show(n >= 1 ? n - 1 : 0);
    wake();
  }
  load().catch(err => msg(`예배 슬라이드를 불러오지 못했습니다. ${err.message} (서버로 열어야 합니다: python3 -m http.server 8000)`));
})();
  </script>
</body>
</html>
