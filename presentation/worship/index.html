<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <title>예배 슬라이드 | 성공회 광명교회</title>
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA1NCIgYXJpYS1sYWJlbD0i6rSR66qF6rWQ7ZqMIOyXtOumsCDruZsiPjxwYXRoIGQ9Ik0yIDU0VjE4LjVDMiA5LjYgOS4yIDIuOCAxOC43NSAxLjZMMTguMzcgMTguOEgxMi40djIuOGg1LjlMMTcuNiA1NFpNMzggNTRWMTguNUMzOCA5LjYgMzAuOCAyLjggMjEuMjUgMS42TDIxLjYzIDE4LjhIMjcuNnYyLjhoLTUuOUwyMi40IDU0WiIgZmlsbD0iIzE3M2EyZSIvPjwvc3ZnPgo=" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/wanted-sans@1.0.3/fonts/webfonts/variable/split/WantedSansVariable.css">
  <style>
/* 예배 슬라이드 — 검은 바탕·흰 글자, 움직임 없음. 데이터: data/worship/YYYYMMDD.json
   화면에는 주제 그림·회중이 응답할 말·노래 가사·현재 위치 막대만 둔다. */
:root{
  --bg:#000;--fg:#fff;--muted:color-mix(in srgb,var(--fg) 58%,var(--bg));--dim:color-mix(in srgb,var(--fg) 22%,var(--bg));
  --accent:#ffd866;--sub:#6a4c93;--panel:#161616;--line:#2c2c2c;
  --u:min(1vh,.5625vw);--nav-h:calc(var(--u)*7.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none}
body{font-family:'Wanted Sans Variable','Wanted Sans',Pretendard,'Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

#stage{position:fixed;inset:0;display:flex}
#stage.has-nav{bottom:var(--nav-h);--chrome:var(--nav-h)}
#stage.has-sub{bottom:calc(var(--nav-h)*2);--chrome:calc(var(--nav-h)*2)}
#stage.is-blank .slide{visibility:hidden}
.slide{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--u)*6) calc(var(--u)*11);min-width:0;overflow:hidden}
.t{font-size:max(18px,calc(var(--u)*7));line-height:1.5;font-weight:600;letter-spacing:-.01em}
.corner{position:absolute;right:calc(var(--u)*5);bottom:calc(var(--u)*2.5);font-size:max(13px,calc(var(--u)*3.4));color:var(--muted);font-weight:500}

.slide--notice{align-items:center;text-align:center}
.slide--notice .t{font-size:max(22px,calc(var(--u)*9));line-height:1.45;font-weight:700;text-wrap:balance}
/* 그림은 잘리지 않게 16:9 틀 안에 둔다. 세로 화면(휴대폰)에서는 위아래가 검게 남는다 */
.slide.slide--notice.has-image,.slide.slide--theme{padding:0;align-items:center;justify-content:center}
.frame{position:relative;flex:none;width:min(100%,calc((100vh - var(--chrome,0px))*16/9));aspect-ratio:16/9;background:#0a0a0a center/cover no-repeat;overflow:hidden}
.slide--notice .frame .t{position:absolute;max-width:80%;font-weight:800;line-height:1.28;text-shadow:0 0 calc(var(--u)*1.2) #000,0 calc(var(--u)*.3) calc(var(--u)*2.4) #000}
.frame .t.m{font-size:calc(var(--u)*8)}
.frame .t.l{font-size:calc(var(--u)*11)}
.frame .t.xl{font-size:calc(var(--u)*14)}
.frame .t.lt{left:calc(var(--u)*5);top:calc(var(--u)*5);text-align:left}
.frame .t.rt{right:calc(var(--u)*5);top:calc(var(--u)*5);text-align:right}
.frame .t.lb{left:calc(var(--u)*5);bottom:calc(var(--u)*5);text-align:left}
.frame .t.rb{right:calc(var(--u)*5);bottom:calc(var(--u)*5);text-align:right}
.frame .t.c{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}

.slide--theme .frame::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.18) 70%)}
.slide--theme .big{position:absolute;left:calc(var(--u)*8);top:50%;transform:translateY(-50%);max-width:84%;font-size:max(26px,calc(var(--u)*12));font-weight:800;line-height:1.25;letter-spacing:-.02em;text-shadow:0 2px 24px rgba(0,0,0,.5)}
.slide--theme .big small{display:block;font-size:.72em;font-weight:600;color:var(--accent)}

.slide--title{align-items:center;text-align:center;gap:calc(var(--u)*2)}
.slide--title .label{font-size:max(18px,calc(var(--u)*4.6));color:var(--muted);font-weight:600}
.slide--title .main{font-size:max(34px,calc(var(--u)*14));font-weight:800;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.slide--title.is-theme{background:#0a0a0a center/cover no-repeat}

.slide--lyrics .t{text-wrap:balance}
.row{display:flex;gap:calc(var(--u)*2.5);align-items:baseline}
.row .sym{flex:none;width:1.4em;text-align:center;color:var(--accent);font-weight:700}
.row.p,.row.l{color:var(--muted);font-size:max(16px,calc(var(--u)*5));font-weight:500;margin-bottom:calc(var(--u)*1.2)}
.row.p .sym,.row.l .sym{color:var(--muted)}
.row.a{font-size:max(20px,calc(var(--u)*7.4));font-weight:700;line-height:1.45;margin-bottom:calc(var(--u)*3)}
.row .tx{text-wrap:pretty}

.slide--reading .head{font-size:max(16px,calc(var(--u)*4.6));color:var(--muted);font-weight:600;margin-bottom:calc(var(--u)*1)}
.slide--reading .ref{font-size:max(22px,calc(var(--u)*8));font-weight:800;line-height:1.3;margin-bottom:calc(var(--u)*7)}

.slide--psalm .t{font-size:max(17px,calc(var(--u)*5.6));font-weight:600;line-height:1.55}
.slide--psalm .line{display:flex;gap:calc(var(--u)*2)}
.slide--psalm .line .mark{flex:none;width:1.4em;text-align:center;color:var(--accent)}
.slide--psalm .line.resp{padding-left:calc(var(--u)*5);color:#ffe9a3;margin-bottom:calc(var(--u)*1.6)}

#nav,#subnav{position:fixed;left:0;right:0;display:flex;background:var(--panel);height:var(--nav-h);z-index:5}
#nav{bottom:0}
#subnav{bottom:var(--nav-h)}
#nav[hidden],#subnav[hidden]{display:none}
#nav div,#subnav div{flex:1;display:flex;align-items:center;justify-content:center;font-size:max(14px,calc(var(--u)*4.2));font-weight:600;color:var(--dim);border-left:1px solid var(--bg)}
#nav div:first-child,#subnav div:first-child{border-left:0}
#nav div.done{color:var(--muted)}
#nav div.cur{background:var(--fg);color:var(--bg);font-weight:800}
#subnav div{background:color-mix(in srgb,var(--sub) 38%,var(--bg));color:color-mix(in srgb,var(--fg) 60%,var(--sub))}
#subnav div.cur{background:var(--fg);color:var(--bg);font-weight:800}

#ui{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px max(10px,2vw);background:linear-gradient(#000c,#0000);z-index:10;transition:opacity .3s}
body.idle #ui{opacity:0;pointer-events:none}
body.idle{cursor:none}
#ui .group{display:flex;align-items:center;gap:4px}
#ui button{min-width:40px;height:36px;padding:0 10px;border:1px solid transparent;background:#0008;border-radius:6px;font-size:15px;white-space:nowrap}
#ui button:hover{border-color:#fff5}
#ui .arrow{font-size:22px}
#counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap;padding:0 6px}
#counter b{color:var(--fg)}

#outline{position:fixed;top:0;left:0;bottom:0;width:min(440px,92vw);background:var(--panel);border-right:1px solid var(--line);padding:56px 14px 12px;overflow-y:auto;transform:translateX(-102%);transition:transform .25s;z-index:20;text-align:left}
#outline.is-open{transform:none}
#outline .sec{margin:14px 0 4px;font-size:13px;color:var(--accent);letter-spacing:.06em}
#outline ol{list-style:none;margin:0;padding:0}
#outline button{display:flex;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 4px;font-size:15px;color:#ddd}
#outline button:hover,#outline button[aria-current=true]{background:#2a2a2a;color:#fff}
#outline .src{margin:18px 4px 4px;color:var(--muted);font-size:12px;line-height:1.7}
#outline .n{min-width:2em;color:var(--muted);font-variant-numeric:tabular-nums}

#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:18px;line-height:1.7;color:var(--muted)}
#msg.is-on{display:flex}
.skip{position:fixed;left:8px;top:-60px;background:var(--fg);color:var(--bg);padding:8px 12px;z-index:30}
.skip:focus{top:8px}
@media (max-width:520px){#ui button{padding:0 6px;font-size:13px}.slide{padding:calc(var(--u)*6) 18px}}
@media (prefers-reduced-motion:reduce){#outline,#ui{transition:none}}
  </style>
</head>
<body>
  <a class="skip" href="#stage">슬라이드로 바로가기</a>
  <main id="stage" aria-live="polite" tabindex="-1"></main>
  <div id="subnav" hidden aria-label="응답 단계"></div>
  <nav id="nav" hidden aria-label="예배 순서 위치"></nav>
  <div id="msg" role="status"></div>
  <aside id="outline" aria-label="목차"></aside>
  <div id="ui">
    <div class="group"><button id="btn-outline" type="button" aria-label="목차 열기 (O)" aria-expanded="false">목차</button></div>
    <div class="group">
      <button id="btn-prev" class="arrow" type="button" aria-label="이전 (←)">‹</button>
      <span id="counter"></span>
      <button id="btn-next" class="arrow" type="button" aria-label="다음 (→)">›</button>
    </div>
    <div class="group">
      <button id="btn-pptx" type="button" aria-label="PowerPoint 파일로 내려받기">PPTX</button>
      <button id="btn-blank" type="button" aria-pressed="false" aria-label="빈 화면 (B)">빈 화면</button>
      <button id="btn-full" type="button" aria-label="전체 화면 (F)">전체 화면</button>
    </div>
  </div>
  <script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage');
  const STAGES = ['모임', '말씀', '응답', '파송'];
  const SUBS = ['예물 준비', '성찬기도', '성체 나눔', '영성체'];
  const SYM = { p: '†', l: '○', a: '◎' };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let data = null;
  let slides = [];
  let cur = 0;
  let blank = false;

  const rowHtml = l => (l.r
    ? `<div class="row ${l.r}"><span class="sym" aria-hidden="true">${SYM[l.r]}</span><span class="tx">${esc(l.text)}</span></div>`
    : `<div class="t">${esc(l.text)}</div>`);
  const corner = s => (s.label ? `<div class="corner">${esc(s.label)}</div>` : '');
  const bg = s => (s.image ? ` style="background-image:url('${/^https?:/.test(s.image) ? '' : '../../'}${esc(s.image)}')"` : '');

  function slideHtml(s) {
    switch (s.kind) {
    case 'notice': {
      const t = s.text ? `<div class="t ${s.image ? `${esc(s.size || 'l')} ${esc(s.pos || 'c')}` : ''}">${esc(s.text).replace(/\n/g, '<br>')}</div>` : '';
      return s.image
        ? `<section class="slide slide--notice has-image"><div class="frame"${bg(s)}${!s.text ? ` role="img" aria-label="${esc(s.alt)}"` : ''}>${t}</div></section>`
        : `<section class="slide slide--notice">${t}</section>`;
    }
    case 'theme':
      return `<section class="slide slide--theme"><div class="frame"${bg(s)}><div class="big">${esc(s.title)}${s.subtitle ? `<small>${esc(s.subtitle)}</small>` : ''}</div></div></section>`;
    case 'title':
      return `<section class="slide slide--title${s.theme ? ' is-theme' : ''}"><div class="label">${esc(s.label)}</div><div class="main">${esc(s.text)}</div>${s.caption ? `<div class="corner">${esc(s.caption)}</div>` : ''}</section>`;
    case 'lyrics':
      return `<section class="slide slide--lyrics">${s.lines.map(rowHtml).join('')}${corner(s)}</section>`;
    case 'dialog':
      return `<section class="slide slide--dialog">${s.lines.map(rowHtml).join('')}${corner(s)}</section>`;
    case 'reading':
      return `<section class="slide slide--reading"><div class="head">${esc(s.label)}</div><div class="ref">${esc(s.ref)}</div>${s.lines.map(rowHtml).join('')}</section>`;
    case 'psalm':
      return `<section class="slide slide--psalm"><div class="t">${s.lines.map(l => `<div class="line${l.mark === '○' ? ' resp' : ''}"><span class="mark" aria-hidden="true">${esc(l.mark || '')}</span><span>${esc(l.text)}</span></div>`).join('')}</div>${corner(s)}</section>`;
    default:
      return '';
    }
  }

  // 위치 막대: 지나온 칸은 흐리게, 지금 칸은 흰 바탕
  function renderNav(s) {
    const idx = STAGES.indexOf(s.stage);
    $('nav').hidden = idx < 0;
    $('nav').innerHTML = idx < 0 ? '' : STAGES.map((n, i) => `<div class="${i < idx ? 'done' : i === idx ? 'cur' : ''}"${i === idx ? ' aria-current="step"' : ''}>${n}</div>`).join('');
    const si = SUBS.indexOf(s.sub);
    $('subnav').hidden = si < 0;
    $('subnav').innerHTML = si < 0 ? '' : SUBS.map((n, i) => `<div class="${i === si ? 'cur' : ''}"${i === si ? ' aria-current="step"' : ''}>${n}</div>`).join('');
    stage.classList.toggle('has-nav', idx >= 0);
    stage.classList.toggle('has-sub', si >= 0);
  }

  function setBlank(on) {
    blank = on;
    stage.classList.toggle('is-blank', blank);
    $('btn-blank').setAttribute('aria-pressed', String(blank));
  }

  function show(i) {
    cur = Math.max(0, Math.min(slides.length - 1, i));
    const s = slides[cur];
    stage.innerHTML = slideHtml(s);
    renderNav(s);
    setBlank(false);
    $('counter').innerHTML = `<b>${cur + 1}</b> / ${slides.length}`;
    $('btn-prev').disabled = cur === 0;
    $('btn-next').disabled = cur === slides.length - 1;
    document.querySelectorAll('#outline button').forEach((b, k) => b.toggleAttribute('aria-current', k === cur));
    try { history.replaceState(null, '', `#${cur + 1}`); } catch (e) { /* 파일 열기 등에서는 주소를 바꾸지 않는다 */ }
  }
  const go = d => show(cur + d);

  function nameOf(s) {
    if (s.kind === 'notice') return `안내 ${s.text || s.alt || ''}`.trim();
    if (s.kind === 'theme') return `${s.title} ${s.subtitle || ''}`.trim();
    if (s.kind === 'reading') return `${s.label} ${s.ref}`;
    return [s.label, s.kind === 'title' && s.label !== s.text ? s.text : ''].filter(Boolean).join(' ');
  }

  function buildOutline() {
    let html = '';
    let last = '\0';
    slides.forEach((s, i) => {
      const sec = s.stage || '안내';
      if (sec !== last) { if (last !== '\0') html += '</ol>'; html += `<div class="sec">${esc(sec)}</div><ol>`; last = sec; }
      html += `<li><button type="button" data-i="${i}"><span class="n">${i + 1}</span><span>${esc(nameOf(s))}</span></button></li>`;
    });
    $('outline').innerHTML = `${html}</ol><p class="src">성경: 공동번역성서(개정판)<br>찬송: 대한성공회 성가집(성가개편위원회) — 성가 번호는 이 성가집의 번호입니다.<br>기도서·응답: 대한성공회 기도서와 광명교회 예배 슬라이드</p>`;
  }

  function toggleOutline(force) {
    const open = force ?? !$('outline').classList.contains('is-open');
    $('outline').classList.toggle('is-open', open);
    $('btn-outline').setAttribute('aria-expanded', String(open));
  }

  function toggleFull() {
    const el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
  }

  $('btn-prev').onclick = () => go(-1);
  $('btn-next').onclick = () => go(1);
  $('btn-blank').onclick = () => setBlank(!blank);
  $('btn-full').onclick = toggleFull;

  // PowerPoint 파일 내려받기: 인터넷이 불안한 곳에서도 쓸 수 있게 한다. 필요한 코드는 누를 때만 불러온다.
  const loadScript = src => new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src;
    el.onload = resolve;
    el.onerror = () => reject(new Error(`${src} 를 불러오지 못했습니다`));
    document.head.appendChild(el);
  });
  $('btn-pptx').onclick = async () => {
    const btn = $('btn-pptx');
    if (btn.disabled) return;
    btn.disabled = true;
    const label = btn.textContent;
    try {
      btn.textContent = '준비 중…';
      if (!window.PptxGenJS) await loadScript('https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js');
      if (!window.buildWorshipPptx) await loadScript('pptx-export.js');
      await window.buildWorshipPptx(data, slides, (i, n) => { btn.textContent = `${i}/${n}`; });
    } catch (err) {
      alert(`PPTX를 만들지 못했습니다. ${err.message}`);
    } finally {
      btn.textContent = label;
      btn.disabled = false;
    }
  };
  $('btn-outline').onclick = () => toggleOutline();
  $('outline').addEventListener('click', e => {
    const b = e.target.closest('button[data-i]');
    if (b) { show(Number(b.dataset.i)); toggleOutline(false); }
  });

  window.addEventListener('hashchange', () => { const n = Number(location.hash.slice(1)); if (slides.length && n >= 1 && n - 1 !== cur) show(n - 1); });

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(k)) { if (document.activeElement?.tagName === 'BUTTON' && (k === ' ' || k === 'Enter')) return; e.preventDefault(); go(1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); go(-1); }
    else if (k === 'Home') show(0);
    else if (k === 'End') show(slides.length - 1);
    else if (k === 'f' || k === 'F') toggleFull();
    else if (k === 'b' || k === 'B' || k === '.') setBlank(!blank);
    else if (k === 'o' || k === 'O') toggleOutline();
    else if (k === 'Escape') toggleOutline(false);
  });

  // 화면 누름: 왼쪽 30%는 이전, 나머지는 다음. 좌우 쓸기도 지원
  stage.addEventListener('click', e => { toggleOutline(false); go(e.clientX < innerWidth * 0.3 ? -1 : 1); });
  let sx = null;
  document.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx;
    sx = null;
    if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
  }, { passive: true });

  // 조작 막대와 커서는 가만히 있으면 숨긴다
  let idleTimer;
  const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000); };
  ['mousemove', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, wake, { passive: true }));

  const msg = text => { $('msg').textContent = text; $('msg').classList.add('is-on'); $('ui').style.display = 'none'; };

  // 안내 만들기에서 올린 그 주 안내 그림(images/worship/notices/YYYYMMDD-1.jpg, -2.jpg …)을
  // 맨 앞 안내 바로 뒤에 넣는다. 번호가 끊기면 거기서 멈춘다.
  async function weeklyNotices(key) {
    const out = [];
    for (let n = 1; n <= 12; n++) {
      const image = `images/worship/notices/${key}-${n}.jpg`;
      try {
        const res = await fetch(`../../${image}`, { method: 'HEAD' });
        if (!res.ok || !(res.headers.get('content-type') || '').startsWith('image/')) break;
      } catch (e) { break; }
      out.push({ kind: 'notice', image, alt: '안내' });
    }
    return out;
  }

  async function load() {
    const q = new URLSearchParams(location.search).get('date');
    let key = q && q.replaceAll('-', '');
    if (!key) {
      const index = await (await fetch('../../data/worship/index.json')).json();
      key = index.dates[0];
    }
    if (!/^\d{8}$/.test(key || '')) throw new Error('날짜 형식은 YYYYMMDD입니다.');
    const res = await fetch(`../../data/worship/${key}.json`);
    if (!res.ok) throw new Error(`${key} 주의 슬라이드가 없습니다.`);
    data = await res.json();
    slides = data.slides.slice();
    const extra = await weeklyNotices(key);
    const at = slides.findIndex(s => s.kind !== 'notice');
    slides.splice(at < 0 ? slides.length : at, 0, ...extra);
    document.title = `${data.title} | 예배 슬라이드`;
    buildOutline();
    const n = Number(location.hash.slice(1));
    show(n >= 1 ? n - 1 : 0);
    wake();
  }
  load().catch(err => msg(`예배 슬라이드를 불러오지 못했습니다. ${err.message} (서버로 열어야 합니다: python3 -m http.server 8000)`));
})();
  </script>
</body>
</html>
