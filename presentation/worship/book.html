<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>예식문 | 성공회 광명교회</title>
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA1NCIgYXJpYS1sYWJlbD0i6rSR66qF6rWQ7ZqMIOyXtOumsCDruZsiPjxwYXRoIGQ9Ik0yIDU0VjE4LjVDMiA5LjYgOS4yIDIuOCAxOC43NSAxLjZMMTguMzcgMTguOEgxMi40djIuOGg1LjlMMTcuNiA1NFpNMzggNTRWMTguNUMzOCA5LjYgMzAuOCAyLjggMjEuMjUgMS42TDIxLjYzIDE4LjhIMjcuNnYyLjhoLTUuOUwyMi40IDU0WiIgZmlsbD0iIzE3M2EyZSIvPjwvc3ZnPgo=" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/wanted-sans@1.0.3/fonts/webfonts/variable/split/WantedSansVariable.css">
  <style>
/* 예식문 — 예배 전체 순서와 악보. 화면에서 읽고 A4로 인쇄한다. 데이터: data/worship/YYYYMMDD.book.json */
:root{
  --bg:#fff;--fg:#141414;--muted:#6a6a6a;--line:#d9d9d9;--accent:#173a2e;--resp:#173a2e;--panel:#f4f4f1;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{--bg:#101412;--fg:#f2f2ee;--muted:#a3a8a4;--line:#2d3430;--accent:#b9d8b4;--resp:#d9efd5;--panel:#181d1a}}
@media print{:root{--bg:#fff;--fg:#000;--muted:#555;--line:#bbb;--accent:#173a2e;--resp:#000;--panel:#fff}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--fg);font-family:'Wanted Sans Variable','Wanted Sans',Pretendard,'Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;line-height:1.6;font-size:16px}
main{max-width:760px;margin:0 auto;padding:28px 18px 64px}
header.top{text-align:center;border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:6px}
header.top h1{margin:0 0 6px;font-size:1.55rem;letter-spacing:-.02em}
header.top p{margin:0;color:var(--muted);font-size:.95rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;margin:10px 0 0;font-size:.85rem;color:var(--muted)}
.legend b{color:var(--accent)}
h2.sec{margin:28px 0 4px;font-size:1.05rem;color:var(--accent);letter-spacing:.04em;border-bottom:1px solid var(--line);padding-bottom:4px;break-after:avoid}
.item{padding:10px 0;border-bottom:1px solid var(--line);break-inside:avoid}
.head{display:flex;align-items:baseline;gap:8px}
.no{flex:none;min-width:1.7em;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.stand{flex:none;width:.9em;color:var(--accent);font-weight:700}
.label{font-weight:700}
.ref{color:var(--accent);font-weight:600;font-size:.95rem}
.by{margin-left:auto;color:var(--muted);font-size:.9rem;text-align:right}
.sub{margin:2px 0 0 calc(1.7em + 8px + .9em + 8px);color:var(--muted);font-size:.9rem}
.body{margin:6px 0 0 calc(1.7em + 8px + .9em + 8px)}
.row{display:flex;gap:10px;align-items:baseline;margin:2px 0}
.who{flex:none;min-width:3.4em;font-size:.78rem;color:var(--muted)}
.row.a .tx{font-weight:700;color:var(--resp)}
.row.a .who{color:var(--accent);font-weight:700}
.plain{margin:2px 0}
.gap{height:.6em}
.psalm .line{display:flex;gap:8px}
.psalm .n{flex:none;width:1.4em;text-align:right;color:var(--muted);font-size:.85rem}
.psalm .mark{flex:none;width:1.2em;text-align:center;color:var(--accent)}
.psalm .resp{padding-left:2.6em}
.score{display:block;max-width:100%;height:auto;margin:6px 0 8px;background:#fff;border-radius:4px}
.noscore{margin:4px 0 0 calc(1.7em + 8px + .9em + 8px);padding:6px 10px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:.85rem}
.tools{display:flex;justify-content:center;gap:8px;margin:14px 0 0}
.tools button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer}
.tools button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{padding:40px 18px;text-align:center;color:var(--muted)}
@media (max-width:520px){.sub,.body,.noscore{margin-left:0}.head{flex-wrap:wrap}}
@media print{
  @page{size:A4;margin:14mm}
  body{font-size:11pt}
  main{max-width:none;padding:0}
  .tools{display:none}
  .score{filter:grayscale(1)}
}
  </style>
</head>
<body>
  <main id="app"><div id="msg" role="status">불러오는 중…</div></main>
  <script>
(() => {
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const WHO = { p: '사제', l: '독서자', a: '회중' };

  const lineHtml = l => {
    if (l.gap) return '<div class="gap"></div>';
    if (l.r) return `<div class="row ${l.r}"><span class="who">${WHO[l.r]}</span><span class="tx">${esc(l.text)}</span></div>`;
    return `<p class="plain">${esc(l.text)}</p>`;
  };
  const psalmHtml = lines => `<div class="psalm">${lines.map(l => `<div class="line${l.mark === '○' ? ' resp' : ''}"><span class="n">${l.n || ''}</span><span class="mark" aria-hidden="true">${esc(l.mark || '')}</span><span>${esc(l.text)}</span></div>`).join('')}</div>`;

  function itemHtml(it, isPsalm) {
    const sub = [it.title, it.kind ? `(${it.kind})` : ''].filter(Boolean).join(' ');
    let body = '';
    if (it.score) body += `<img class="score" src="../../${esc(it.score)}" alt="${esc(it.label)} 악보">`;
    else if (/^성가 /.test(it.ref || '') && !it.lines.length) body += `<div class="noscore">${esc(it.ref)} — 악보 미등록 (성가집을 보세요)</div>`;
    if (it.lines.length) body += `<div class="body">${isPsalm ? psalmHtml(it.lines) : it.lines.map(lineHtml).join('')}</div>`;
    return `<section class="item"><div class="head"><span class="no">${it.no}</span><span class="stand" aria-label="${it.stand ? '일어섭니다' : ''}">${it.stand ? '†' : ''}</span><span class="label">${esc(it.label)}</span>${it.ref ? `<span class="ref">${esc(it.ref)}</span>` : ''}${it.by ? `<span class="by">${esc(it.by)}</span>` : ''}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}${body}</section>`;
  }

  function render(d) {
    document.title = `${d.title} 예식문 | 성공회 광명교회`;
    const meta = [d.celebrant && `집전 ${d.celebrant}`, d.preacher && `설교 ${d.preacher}`, d.form].filter(Boolean).join(' · ');
    $app.innerHTML = `<header class="top"><h1>${esc(d.title)}</h1><p>${esc(meta)}</p><p>${esc(d.date.replaceAll('-', '. '))}</p><div class="legend"><span><b>†</b> 일어섭니다</span><span><b>회중</b> 함께 말하는 부분</span></div><div class="tools"><button type="button" onclick="print()">인쇄</button></div></header>`
      + d.sections.map(s => `<h2 class="sec">${esc(s.title)}</h2>${s.items.map(it => itemHtml(it, it.label === '성시')).join('')}`).join('');
  }

  const $app = document.getElementById('app');
  (async () => {
    try {
      const q = new URLSearchParams(location.search).get('date');
      let key = q && q.replaceAll('-', '');
      if (!key) key = (await (await fetch('../../data/worship/index.json')).json()).dates[0];
      if (!/^\d{8}$/.test(key || '')) throw new Error('날짜 형식은 YYYYMMDD입니다.');
      const res = await fetch(`../../data/worship/${key}.book.json`);
      if (!res.ok) throw new Error(`${key} 주의 예식문이 없습니다.`);
      render(await res.json());
    } catch (err) {
      $app.innerHTML = `<div id="msg" role="status">예식문을 불러오지 못했습니다. ${esc(err.message)} (서버로 열어야 합니다: python3 -m http.server 8000)</div>`;
    }
  })();
})();
  </script>
</body>
</html>
