<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f5f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101513" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="대한성공회 광명교회 주일 주보 — 예배 순서, 성경·성가·기도서, 교회소식">
  <title>모바일 주보 | 대한성공회 광명교회</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <style>
/* 모바일 주보 — 주보 한 주를 휴대폰에서 읽는 화면. iPhone(Safari)·Galaxy(삼성 인터넷·Chrome) 기준.
   데이터: data/jubo/YYYYMMDD.json(표지·본기도·묵상·다음 주 봉사), data/worship/YYYYMMDD.book.json(예배 순서·응답·악보),
   data/worship-order.json(주보에 없는 순서 표시), data/bulletin-news.json, data/bulletin-verses.json, data.js(교회 정보) */
:root{
  --bg:#f6f5f0; --surface:#ffffff; --surface-2:#eef2ec; --ink:#161a17; --ink-2:#4a4f4b; --ink-3:#6b716c;
  --line:#e2e5df; --brand:#173a2e; --brand-2:#285a47; --brand-ink:#ffffff; --accent:#2f6b52; --resp:#173a2e;
  --chip:#e5ede6; --chip-ink:#1f4a3a; --shadow:0 1px 2px rgba(20,30,24,.06),0 4px 14px rgba(20,30,24,.05);
  --radius:16px; --gutter:16px; --bar:56px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101513; --surface:#171d1a; --surface-2:#1d2622; --ink:#eef1ec; --ink-2:#c3c9c3; --ink-3:#98a099;
    --line:#2a332e; --brand:#b9d8b4; --brand-2:#9cc7a4; --brand-ink:#0f1a14; --accent:#a8d3b0; --resp:#d9efd5;
    --chip:#24312a; --chip-ink:#cfe6d2; --shadow:none; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-size:100%;scroll-behavior:smooth;scroll-padding-top:calc(var(--bar) + 52px + var(--safe-t))}
html[data-size="1"]{font-size:112.5%} html[data-size="2"]{font-size:125%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:1rem;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-left:var(--safe-l);padding-right:var(--safe-r)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.wrap{max-width:560px;margin:0 auto;padding:0 var(--gutter)}

/* 상단 바 */
.appbar{position:sticky;top:0;z-index:20;padding-top:var(--safe-t);background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.appbar .wrap{display:flex;align-items:center;gap:8px;height:var(--bar)}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0;flex:1;text-decoration:none;color:var(--ink)}
.brand b{font-size:1rem;letter-spacing:-.01em}
.brand span{font-size:.78rem;color:var(--ink-3)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--brand);cursor:pointer}
.iconbtn:active{background:var(--surface-2)}
.iconbtn .txt{font-weight:800;font-size:.95rem;letter-spacing:-.03em}
.tabs{border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  color:var(--ink-2);font-size:.88rem;font-weight:600;text-decoration:none;white-space:nowrap}
.tab[aria-current="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

main{padding-bottom:calc(32px + var(--safe-b))}
section.block{margin-top:28px}
h2.h{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:1.12rem;letter-spacing:-.02em;color:var(--brand)}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}

/* 표지 */
.cover{margin-top:8px;overflow:hidden}
.cover img{display:block;width:100%;height:auto;aspect-ratio:616/410;object-fit:cover;background:var(--surface-2)}
.cover .in{padding:18px 18px 20px}
.kicker{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.pill{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font-size:.78rem;font-weight:700}
.cover h1{margin:0;font-size:1.6rem;line-height:1.3;letter-spacing:-.03em}
.cover .meta{margin:8px 0 0;color:var(--ink-2);font-size:.92rem}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 0}
.time{padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.time b{display:block;font-size:1.05rem;color:var(--brand)}
.time span{font-size:.82rem;color:var(--ink-2)}
.motto{margin:14px 0 0;padding-top:12px;border-top:1px dashed var(--line);font-size:.84rem;color:var(--ink-3);line-height:1.6}
.motto b{color:var(--ink-2);font-weight:600}

/* 이번 주 말씀 */
.verse{margin:14px 0 0;padding:18px;background:var(--brand);color:var(--brand-ink);border:0}
.verse p{margin:0;font-size:.78rem;font-weight:700;letter-spacing:.06em;opacity:.8}
.verse blockquote{margin:8px 0 10px;font-size:1.08rem;line-height:1.7;font-weight:600}
.verse a{display:inline-flex;align-items:center;gap:6px;color:inherit;font-size:.9rem;font-weight:700;text-underline-offset:3px}

/* 예배 순서 */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:0 0 10px;font-size:.84rem;color:var(--ink-2)}
.legend .stand-mark{color:var(--accent);font-weight:800}
.legend .who-a{color:var(--resp);font-weight:800}
.legend .sp{flex:1}
.ghost{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:.84rem;font-weight:600;color:var(--brand);cursor:pointer}
.part{margin:18px 0 8px;font-size:.86rem;font-weight:800;letter-spacing:.04em;color:var(--ink-3)}
.items{display:flex;flex-direction:column;gap:8px}
details.item,div.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.item[open]{box-shadow:var(--shadow)}
.item summary,.item .sum{list-style:none;display:grid;grid-template-columns:1.1rem 1fr auto;align-items:center;gap:2px 8px;min-height:56px;padding:10px 12px 10px 10px;cursor:pointer}
.item summary::-webkit-details-marker{display:none}
.item .sum{cursor:default}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mark{color:var(--accent);font-weight:800;text-align:center;font-size:1rem}
.lbl{min-width:0}
.lbl b{display:block;font-size:1rem;font-weight:700;line-height:1.35}
.lbl small{display:block;font-size:.8rem;color:var(--ink-3);line-height:1.4;margin-top:2px}
.ref{display:inline-flex;align-items:center;gap:4px;margin-top:4px;padding:2px 8px;border-radius:8px;background:var(--chip);color:var(--chip-ink);font-size:.8rem;font-weight:700}
.side{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:.82rem;text-align:right;max-width:9.5em}
.chev{width:16px;height:16px;flex:none;transition:transform .2s}
details[open] .chev{transform:rotate(180deg)}
.item.extra{background:transparent;border-style:dashed}
.item.extra .lbl b{font-weight:600;color:var(--ink-2)}
.body{padding:2px 14px 16px 30px;border-top:1px solid var(--line)}
.body > *:first-child{margin-top:12px}
.row{display:grid;grid-template-columns:3.2em 1fr;gap:8px;margin:6px 0;align-items:baseline}
.who{font-size:.74rem;color:var(--ink-3);font-weight:600}
.row.a .tx{font-weight:700;color:var(--resp)}
.row.a .who{color:var(--accent);font-weight:800}
.plain{margin:6px 0}
.gap{height:.5em}
.prayer{margin:12px 0;padding:12px 14px;border-radius:12px;background:var(--surface-2);line-height:1.75}
.prayer small{display:block;color:var(--ink-3);font-size:.78rem;font-weight:700;margin-bottom:4px}
.psalm .ln{display:grid;grid-template-columns:1.4em 1.2em 1fr;gap:4px;margin:4px 0}
.psalm .n{color:var(--ink-3);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
.psalm .m{color:var(--accent);text-align:center}
.psalm .r .t{font-weight:700;color:var(--resp)}
.scap{margin:14px 0 0;font-size:.84rem;font-weight:700;color:var(--ink-2)}
.scap + .score{margin-top:6px}
.score{display:block;margin:12px 0 0;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.score img{display:block;width:100%;height:auto}
.hint{margin:6px 0 0;font-size:.78rem;color:var(--ink-3)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;background:var(--surface-2);color:var(--brand);
  font-size:.9rem;font-weight:700;text-decoration:none;border:1px solid var(--line)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.ext{width:.9em;height:.9em;flex:none;opacity:.85;vertical-align:-.1em}

/* 묵상 */
.reflect{padding:20px 18px}
.reflect h3{margin:0;font-size:1.3rem;letter-spacing:-.02em}
.reflect .src{margin:4px 0 14px;font-size:.84rem;color:var(--ink-3)}
.reflect p{margin:0 0 1em;font-size:1.02rem;line-height:1.85;color:var(--ink)}
.reflect p.amen{font-weight:700}
.reflect .from{margin:0;text-align:right;font-size:.84rem;color:var(--ink-3)}

/* 교회소식 */
.news{display:flex;flex-direction:column;gap:8px}
.news article{padding:14px 16px}
.news h3{margin:0 0 6px;font-size:1rem;line-height:1.4}
.news p{margin:0;color:var(--ink-2);font-size:.95rem;white-space:pre-line}
.news dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:6px 0 0;font-size:.95rem}
.news dt{color:var(--ink-3);font-weight:700}
.news dd{margin:0;color:var(--ink)}

/* 다음 주 봉사 */
.serve{padding:6px 16px 14px}
.serve h3{margin:14px 0 6px;font-size:.86rem;color:var(--ink-3);letter-spacing:.04em}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:0 10px;margin:0}
.kv dt,.kv dd{padding:9px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.kv dt{color:var(--ink-3);font-weight:700}
.kv dd{margin:0}
.kv dd a{font-weight:700;text-decoration:none}
.kv .by{color:var(--ink-3);font-size:.86rem}

/* 안내 */
.info{padding:6px 16px 16px}
.info .kv dd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.copy{flex:none;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--brand);font-size:.82rem;font-weight:700;cursor:pointer}
.foot{margin:24px 0 0;font-size:.78rem;color:var(--ink-3);line-height:1.7;text-align:center}
.foot a{color:var(--ink-2)}
#toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translate(-50%,20px);opacity:0;padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--bg);
  font-size:.88rem;font-weight:600;pointer-events:none;transition:.2s;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}
#msg{padding:48px 8px;text-align:center;color:var(--ink-3)}
@media (min-width:600px){.cover h1{font-size:1.85rem}}
@media print{.appbar,.tabs,.links,.copy,.ghost{display:none}details.item{break-inside:avoid}body{background:#fff}}
  </style>
</head>
<body>
  <header class="appbar">

      <button class="iconbtn" id="sizeBtn" type="button" aria-label="글자 크기 바꾸기"><span class="txt">가<small style="font-size:.7em">가</small></span></button>
      <button class="iconbtn" id="shareBtn" type="button" aria-label="주보 링크 공유">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5v11"/><path d="m7.5 8 4.5-4.5L16.5 8"/><path d="M5 12.5v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>

    <nav class="tabs" aria-label="주보 바로가기">

        <a class="tab" href="#serve">봉사자</a>
        <a class="tab" href="#info">안내</a>
      </div>
    </nav>
  </header>
  <main class="wrap" id="app"><div id="msg" role="status">주보를 불러오는 중…</div></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="../data.js"></script>
  <script>
(() => {
  // 공동번역 온라인(대한성공회 bible.anglican.kr) 책 이름 → 주소용 책 id. 출처: https://bible.anglican.kr/data/books.json
  const BIBLE = {"창세기":"gen","창세":"gen","출애굽기":"exod","출애":"exod","레위기":"lev","레위":"lev","민수기":"num","민수":"num","신명기":"deut","신명":"deut","여호수아":"josh","여호":"josh","판관기":"judg","판관":"judg","룻기":"ruth","사무엘상":"1sam","1사무":"1sam","사무엘하":"2sam","2사무":"2sam","열왕기상":"1kgs","1열왕":"1kgs","열왕기하":"2kgs","2열왕":"2kgs","역대기상":"1chr","1역대":"1chr","역대기하":"2chr","2역대":"2chr","에즈라":"ezra","에즈":"ezra","느헤미야":"neh","느헤":"neh","토비트":"tob","토비":"tob","유딧":"jdt","에스델":"esth","에스":"esth","마카베오상":"1macc","1마카":"1macc","마카베오하":"2macc","2마카":"2macc","욥기":"job","시편":"ps","잠언":"prov","전도서":"eccl","전도":"eccl","아가":"song","지혜서":"wis","지혜":"wis","집회서":"sir","집회":"sir","이사야":"isa","이사":"isa","예레미야":"jer","예레":"jer","애가":"lam","바룩":"bar","에제키엘":"ezek","에제":"ezek","다니엘":"dan","다니":"dan","호세아":"hos","호세":"hos","요엘":"joel","아모스":"amos","아모":"amos","오바디야":"obad","오바":"obad","요나":"jonah","미가":"mic","나훔":"nah","하바꾹":"hab","하바":"hab","스바니야":"zeph","스바":"zeph","하깨":"hag","즈가리야":"zech","즈가":"zech","말라기":"mal","말라":"mal","마태오의 복음서":"matt","마태":"matt","마르코의 복음서":"mark","마르":"mark","루가의 복음서":"luke","루가":"luke","요한의 복음서":"john","요한":"john","사도행전":"acts","사도":"acts","로마인들에게 보낸 편지":"rom","로마":"rom","고린토인들에게 보낸 첫째 편지":"1cor","1고린":"1cor","고린토인들에게 보낸 둘째 편지":"2cor","2고린":"2cor","갈라디아인들에게 보낸 편지":"gal","갈라":"gal","에페소인들에게 보낸 편지":"eph","에페":"eph","필립비인들에게 보낸 편지":"phil","필립":"phil","골로사이인들에게 보낸 편지":"col","골로":"col","데살로니카인들에게 보낸 첫째 편지":"1thess","1데살":"1thess","데살로니카인들에게 보낸 둘째 편지":"2thess","2데살":"2thess","디모테오에게 보낸 첫째 편지":"1tim","1디모":"1tim","디모테오에게 보낸 둘째 편지":"2tim","2디모":"2tim","디도에게 보낸 편지":"titus","디도":"titus","필레몬에게 보낸 편지":"phlm","필레":"phlm","히브리인들에게 보낸 편지":"heb","히브":"heb","야고보의 편지":"jas","야고":"jas","베드로의 첫째 편지":"1pet","1베드":"1pet","베드로의 둘째 편지":"2pet","2베드":"2pet","요한의 첫째 편지":"1john","1요한":"1john","요한의 둘째 편지":"2john","2요한":"2john","요한의 셋째 편지":"3john","3요한":"3john","유다의 편지":"jude","유다":"jude","요한의 묵시록":"rev","묵시":"rev"};
  const BIBLE_URL = 'https://bible.anglican.kr';
  const BCP_URL = 'https://dulkuka12.github.io/kbcp/ucharist-form1.html';
  const ROOT = '../';
  const WHO = { p: '사제', l: '독서자', a: '회중' };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const use = (name, cls = 'ic') => `<svg class="${cls}" aria-hidden="true"><use href="${ROOT}images/icons.svg#${name}"/></svg>`;
  const EXT = '<svg class="ext" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5h4.5V7"/><path d="M13.5 2.5 7 9"/><path d="M11.5 9.5v3a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3"/></svg>';
  const CHEV = '<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>';
  const extLink = (url, text, cls = 'btn') => `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener">${esc(text)} ${EXT}</a>`;

  // "마태오의 복음서 5:1-12" · "마태 5:1-12" · "시편 34편" · "여호 24:3상-14-18" → 공동번역 온라인 주소
  function bibleUrl(ref) {
    const ps = /^시편\s*(\d+)편/.exec(ref);
    if (ps) return `${BIBLE_URL}/ps/${ps[1]}`;
    const m = /^(.+?)\s+(\d+)(?::(.+))?$/.exec(String(ref).trim());
    if (!m || !BIBLE[m[1]]) return null;
    const range = /^(\d+)(?:-(\d+))?$/.exec(m[3] || '');
    return `${BIBLE_URL}/${BIBLE[m[1]]}/${m[2]}${range ? '/' + range[1] + (range[2] ? '-' + range[2] : '') : ''}`;
  }
  const shortRef = ref => {
    const m = /^(.+?)\s+(\d+.*)$/.exec(ref || '');
    if (!m) return ref;
    const short = Object.keys(BIBLE).find(k => BIBLE[k] === BIBLE[m[1]] && k.length < m[1].length);
    return short ? `${short} ${m[2]}` : ref;
  };
  const kDate = d => { const [y, m, dd] = d.split('-').map(Number); return `${y}년 ${m}월 ${dd}일`; };
  const toast = t => { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); };
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch {
      const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch {} ta.remove(); return ok;
    }
  }
  const getJson = async path => { const r = await fetch(ROOT + path, { cache: 'no-cache' }); if (!r.ok) throw new Error(path); return r.json(); };
  const tryJson = path => getJson(path).catch(() => null);

  const lineHtml = l => {
    if (l.gap) return '<div class="gap"></div>';
    if (l.r) return `<div class="row ${l.r}"><span class="who">${WHO[l.r]}</span><span class="tx">${esc(l.text)}</span></div>`;
    return `<p class="plain">${esc(l.text)}</p>`;
  };
  const psalmHtml = lines => `<div class="psalm">${lines.map(l => `<div class="ln${l.mark === '○' ? ' r' : ''}"><span class="n">${l.n || ''}</span><span class="m" aria-hidden="true">${esc(l.mark || '')}</span><span class="t">${esc(l.text)}</span></div>`).join('')}</div>`;
  const scoreHtml = (src, alt) => `<a class="score" href="${ROOT}${esc(src)}" target="_blank" rel="noopener"><img src="${ROOT}${esc(src)}" alt="${esc(alt)}" loading="lazy" decoding="async"></a>`;

  function itemBody(it, ctx) {
    let h = '';
    const isHymn = /^성가 /.test(it.ref || '');
    const isBcp = /^기도서 /.test(it.ref || '');
    if (it.label === '본기도' && ctx.jubo.collect) h += `<div class="prayer"><small>오늘의 본기도</small>${esc(ctx.jubo.collect)}</div>`;
    if (it.kind) h += `<p class="hint">${esc(it.kind)} 말씀 · 본문은 아래 단추로 엽니다</p>`;
    if (it.label === '성시') h += psalmHtml(it.lines);
    else if (it.lines.length) h += it.lines.map(lineHtml).join('');
    if (it.label === '설교') h += `<p class="plain">오늘 말씀: ${esc(ctx.gospel || '')}</p>`;
    const scores = it.score ? [it.score] : (it.scores || []);
    if (scores.length && isHymn) h += `<p class="scap">${esc(it.ref)}${it.title ? ` · ${esc(it.title)}` : ''} 악보</p>`;
    scores.forEach((s, i) => { h += scoreHtml(s, `${it.ref || it.label} 악보${scores.length > 1 ? ` ${i + 1}/${scores.length}` : ''}`); });
    if (scores.length) h += `<p class="hint">악보를 누르면 크게 볼 수 있습니다${isHymn ? '. 한 쪽에 두 곡이 실린 경우 번호를 확인해 주세요' : ''}</p>`;
    const links = [];
    const bible = it.kind || it.label === '성시' ? bibleUrl(it.ref) : null;
    if (bible) links.push(extLink(bible, it.label === '성시' ? '공동번역 시편 읽기' : '공동번역으로 읽기', 'btn primary'));
    if (isHymn && it.link) links.push(extLink(it.link.url, `성가집 PDF ${/\d+쪽/.exec(it.link.text)?.[0] || ''}`.trim()));
    if (isBcp || it.label === '영성체후기도' || it.label === '본기도') links.push(extLink(BCP_URL, '기도서 감사성찬례 1형식'));
    if (it.label === '교회소식') links.push(`<a class="btn" href="#news">교회소식 보기</a>`);
    if (it.label === '설교') links.push(`<a class="btn" href="#reflection">묵상 글 읽기</a>`);
    if (links.length) h += `<div class="links">${links.join('')}</div>`;
    return h;
  }

  function itemHtml(it, ctx) {
    const extra = ctx.extra.has(it.no);
    const refText = /^성가 |^기도서 /.test(it.ref || '') ? it.ref : (it.ref ? shortRef(it.ref) : (it.label === '영성체후기도' ? '기도서 271쪽' : ''));
    const sub = it.title || (extra ? '주보에는 없는 순서 · 회중 응답' : '');
    const body = itemBody(it, ctx);
    const head = `<span class="mark" aria-hidden="true">${it.stand ? '†' : ''}</span>
      <span class="lbl"><b>${esc(it.label)}${it.stand ? '<span class="sr"> (일어섭니다)</span>' : ''}</b>${sub ? `<small>${esc(sub)}</small>` : ''}${refText ? `<span class="ref">${esc(refText)}</span>` : ''}</span>
      <span class="side">${esc(it.by || '')}${body ? CHEV : ''}</span>`;
    return body
      ? `<details class="item${extra ? ' extra' : ''}"><summary>${head}</summary><div class="body">${body}</div></details>`
      : `<div class="item static${extra ? ' extra' : ''}"><div class="sum">${head}</div></div>`;
  }

  function newsHtml(items) {
    if (!items?.length) return '<p class="card" style="padding:16px;margin:0;color:var(--ink-3)">이번 주 교회소식이 없습니다.</p>';
    return `<div class="news">${items.map(n => {
      const lines = n.body.split('\n');
      const kv = lines.filter(l => /^[^:]{1,6}\s*:\s*/.test(l));
      const rest = lines.filter(l => !kv.includes(l));
      return `<article class="card"><h3>${esc(n.title)}</h3>${rest.length ? `<p>${esc(rest.join('\n'))}</p>` : ''}${kv.length ? `<dl>${kv.map(l => { const [k, ...v] = l.split(':'); return `<dt>${esc(k.trim())}</dt><dd>${esc(v.join(':').trim())}</dd>`; }).join('')}</dl>` : ''}</article>`;
    }).join('')}</div>`;
  }

  function render({ jubo, book, order, news, verse }) {
    const info = (typeof CHURCH_DATA !== 'undefined' && CHURCH_DATA.info) || {};
    const giving = (typeof CHURCH_DATA !== 'undefined' && CHURCH_DATA.giving) || {};
    const vision = info.vision || '';
    const items = book.sections.flatMap(s => s.items);
    const orderItems = (order?.items || []).filter(i => !i.section);
    const extra = new Set(orderItems.map((o, i) => o.extra ? i + 1 : 0).filter(Boolean));
    const gospelItem = items.find(i => i.kind === '복음서');
    const ctx = { jubo, extra, gospel: gospelItem ? shortRef(gospelItem.ref) : '' };
    const title = jubo.title.replace(/^\((.+?)\)\s*/, '');
    const year = /^\((.+?)\)/.exec(jubo.title)?.[1];
    const date = kDate(jubo.date);
    document.title = `${date} 주보 | 대한성공회 광명교회`;
    document.getElementById('sub').textContent = `제${jubo.issue}호 · ${date}`;
    const clergy = [book.celebrant && `집전 ${book.celebrant}`, book.preacher && book.preacher !== book.celebrant && `설교 ${book.preacher}`].filter(Boolean);
    if (book.preacher && book.preacher === book.celebrant) clergy[0] = `집전·설교 ${book.celebrant}`;

    const verseUrl = verse && bibleUrl(verse.ref);
    const nw = jubo.nextWeek;
    const app = document.getElementById('app');
    app.innerHTML = `
      <article class="card cover">
        ${jubo.cover ? `<img src="${ROOT}${esc(jubo.cover.src)}" alt="${esc(jubo.cover.alt)}" width="616" height="410" fetchpriority="high">` : ''}
        <div class="in">
          <p class="kicker"><span class="pill">${esc(date)}</span>${year ? `<span class="pill">${esc(year)}</span>` : ''}<span class="pill">제${esc(jubo.issue)}호</span></p>
          <h1>${esc(title)}</h1>
          <p class="meta">${esc(clergy.join(' · '))}${book.form ? ` · ${esc(book.form)}` : ''}</p>
          <div class="times">${(jubo.services || []).map(s => `<div class="time"><b>${esc(s.time)}</b><span>${esc(s.name)}</span></div>`).join('')}</div>
          <p class="motto"><b>교구 표어</b> ${esc(vision)}<br><b>교회 표어</b> 함께 배우고, 함께 돌보는 교회</p>
        </div>
      </article>
      ${verse ? `<figure class="card verse"><p>이번 주 말씀</p><blockquote>${esc(verse.text)}</blockquote><figcaption>${verseUrl ? `<a href="${esc(verseUrl)}" target="_blank" rel="noopener">${esc(verse.ref)} · 공동번역으로 읽기 ${EXT}</a>` : esc(verse.ref)}</figcaption></figure>` : ''}

      <section class="block" id="order" aria-labelledby="h-order">
        <h2 class="h" id="h-order">${use('cross')}예배 순서</h2>
        <div class="legend"><span><span class="stand-mark">†</span> 일어섭니다</span><span><span class="who-a">회중</span> 함께 말합니다</span><span class="sp"></span><button class="ghost" id="toggleAll" type="button" aria-pressed="false">모두 펼치기</button></div>
        ${book.sections.map(s => `<p class="part">${esc(s.title)}</p><div class="items">${s.items.map(it => itemHtml(it, ctx)).join('')}</div>`).join('')}
        <p class="hint" style="margin-top:12px">항목을 누르면 응답·가사·악보와 성경·성가·기도서 링크가 열립니다. 점선 항목은 주보에는 없지만 예배 중 함께 하는 응답입니다.</p>
      </section>

      ${jubo.reflection ? `<section class="block" id="reflection" aria-labelledby="h-ref">
        <h2 class="h" id="h-ref">${use('candle')}묵상</h2>
        <article class="card reflect">
          <h3>${esc(jubo.reflection.title)}</h3>
          <p class="src">${jubo.reflection.ref ? (bibleUrl(jubo.reflection.ref) ? `<a href="${esc(bibleUrl(jubo.reflection.ref))}" target="_blank" rel="noopener">${esc(jubo.reflection.ref)}</a>` : esc(jubo.reflection.ref)) : ''}</p>
          ${jubo.reflection.paragraphs.map((p, i, a) => `<p${i === a.length - 1 ? ' class="amen"' : ''}>${esc(p)}</p>`).join('')}
          ${jubo.reflection.source ? `<p class="from">— ${esc(jubo.reflection.source)}</p>` : ''}
        </article>
      </section>` : ''}

      <section class="block" id="news" aria-labelledby="h-news">
        <h2 class="h" id="h-news">${use('calendar')}교회소식</h2>
        ${newsHtml(news)}
      </section>

      ${nw ? `<section class="block" id="serve" aria-labelledby="h-serve">
        <h2 class="h" id="h-serve">${use('people')}다음 주일 봉사자 <span style="font-size:.8rem;color:var(--ink-3);font-weight:600">${esc(kDate(nw.date))}</span></h2>
        <div class="card serve">
          <h3>말씀</h3>
          <dl class="kv">${nw.readings.map(r => { const u = bibleUrl(r.ref); return `<dt>${esc(r.label)}</dt><dd>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(r.ref)}</a>` : esc(r.ref)}${r.by ? ` <span class="by">· ${esc(r.by)}</span>` : ''}</dd>`; }).join('')}</dl>
          <h3>맡은 일</h3>
          <dl class="kv">${nw.roles.map(r => `<dt>${esc(r.label)}</dt><dd>${esc(r.name)}</dd>`).join('')}</dl>
          ${(nw.rotations || []).map(g => `<h3>${esc(g.label)}</h3><dl class="kv">${g.rows.map(([d, n]) => `<dt>${esc(d)}</dt><dd>${esc(n)}</dd>`).join('')}</dl>`).join('')}
        </div>
      </section>` : ''}

      <section class="block" id="info" aria-labelledby="h-info">
        <h2 class="h" id="h-info">${use('church')}교회 안내</h2>
        <div class="card info">
          <dl class="kv">
            ${info.address ? `<dt>주소</dt><dd><span>${esc(info.address)}${info.postalCode ? ` (${esc(info.postalCode)})` : ''}</span><button class="copy" type="button" data-copy="${esc(info.address)}">복사</button></dd>` : ''}
            ${info.phone ? `<dt>전화</dt><dd><a href="tel:${esc(info.phone.replace(/-/g, ''))}">${esc(info.phone)}</a></dd>` : ''}
            ${giving.bank ? `<dt>봉헌계좌</dt><dd><span>${esc(giving.bankName || '')} ${esc(giving.bank)}<br><span class="by">${esc(giving.holder || '')}</span></span><button class="copy" type="button" data-copy="${esc(giving.bankName || '')} ${esc(giving.bank)}">복사</button></dd>` : ''}
          </dl>
          <div class="links">
            <a class="btn" href="${ROOT}visit.html">${use('map')}오시는 길</a>
            <a class="btn" href="${ROOT}bulletin.html">${use('book')}주보 원본·PDF</a>
            <a class="btn" href="${ROOT}index.html">${use('church')}홈페이지</a>
          </div>
        </div>
        <p class="foot">성경: 공동번역성서(개정판) — <a href="${BIBLE_URL}/" target="_blank" rel="noopener">bible.anglican.kr</a><br>
          성가: 대한성공회 성가집(2015) — <a href="https://dulkuka12.github.io/khymn/hymnbook.pdf" target="_blank" rel="noopener">성가집 PDF</a><br>
          기도서: 대한성공회 기도서 — <a href="${BCP_URL}" target="_blank" rel="noopener">감사성찬례 1형식</a></p>
      </section>`;

    // 모두 펼치기/접기
    const all = () => [...app.querySelectorAll('details.item:not(.static)')];
    const tg = document.getElementById('toggleAll');
    tg.addEventListener('click', () => {
      const open = tg.getAttribute('aria-pressed') !== 'true';
      all().forEach(d => { d.open = open; });
      tg.setAttribute('aria-pressed', String(open));
      tg.textContent = open ? '모두 접기' : '모두 펼치기';
    });
    app.addEventListener('click', async e => {
      const b = e.target.closest('[data-copy]');
      if (!b) return;
      toast(await copy(b.dataset.copy) ? '복사했습니다' : '복사하지 못했습니다');
    });

    // 바로가기 탭: 지금 보는 단락 표시
    const tabs = [...document.querySelectorAll('.tab')];
    const byId = Object.fromEntries(tabs.map(t => [t.getAttribute('href').slice(1), t]));
    tabs.forEach(t => { if (!document.getElementById(t.getAttribute('href').slice(1))) t.hidden = true; });
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver(entries => {
        entries.filter(en => en.isIntersecting).forEach(en => {
          tabs.forEach(t => t.removeAttribute('aria-current'));
          const t = byId[en.target.id];
          if (t) {
            t.setAttribute('aria-current', 'true');
            // 탭 줄만 가로로 옮긴다. scrollIntoView는 고정(sticky) 머리글 때문에 문서 스크롤까지 건드려 화면이 튕긴다
            const strip = t.parentElement;
            strip.scrollLeft = t.offsetLeft - (strip.clientWidth - t.offsetWidth) / 2;
          }
        });
      }, { rootMargin: '-40% 0px -55% 0px' });
      Object.keys(byId).forEach(id => { const el = document.getElementById(id); if (el) io.observe(el); });
    }
  }

  // 글자 크기 (보통 → 크게 → 아주 크게) — 이 기기에만 기억
  const root = document.documentElement;
  let size = 0;
  try { size = Number(localStorage.getItem('jubo-size')) || 0; } catch {}
  const applySize = () => { if (size) root.dataset.size = String(size); else delete root.dataset.size; };
  applySize();
  document.getElementById('sizeBtn').addEventListener('click', () => {
    size = (size + 1) % 3; applySize();
    try { localStorage.setItem('jubo-size', String(size)); } catch {}
    toast(['글자 보통', '글자 크게', '글자 아주 크게'][size]);
  });
  document.getElementById('shareBtn').addEventListener('click', async () => {
    const data = { title: document.title, text: '대한성공회 광명교회 주보', url: location.href };
    if (navigator.share) { try { await navigator.share(data); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    toast(await copy(location.href) ? '주보 링크를 복사했습니다' : '링크를 복사하지 못했습니다');
  });

  (async () => {
    const app = document.getElementById('app');
    try {
      const q = (new URLSearchParams(location.search).get('date') || '').replaceAll('-', '');
      const key = /^\d{8}$/.test(q) ? q : (await getJson('data/jubo/index.json')).dates[0];
      const iso = `${key.slice(0, 4)}-${key.slice(4, 6)}-${key.slice(6)}`;
      const [jubo, book, orderAll, newsAll, versesAll] = await Promise.all([
        getJson(`data/jubo/${key}.json`), getJson(`data/worship/${key}.book.json`),
        tryJson('data/worship-order.json'), tryJson('data/bulletin-news.json'), tryJson('data/bulletin-verses.json')
      ]);
      render({ jubo, book, order: orderAll?.weeks?.[iso], news: newsAll?.weeks?.[iso], verse: versesAll?.weeks?.[iso] });
      if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
    } catch (err) {
      app.innerHTML = `<div id="msg" role="status">주보를 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.</div>`;
      console.error(err);
    }
  })();
})();
  </script>
</body>
</html>
